name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    outputs:
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:contact
      - run: npm run build
      - run: npm run check:static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
      - name: Wait for uploaded artifact metadata
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          const expected = Number(process.env.PAGES_ARTIFACT_ID);
          if (!Number.isSafeInteger(expected) || expected <= 0) throw new Error('Upload did not return an artifact ID');
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts?per_page=100`;
          for (let attempt = 1; attempt <= 12; attempt++) {
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              signal: AbortSignal.timeout(10000),
            });
            if (!response.ok) throw new Error(`Artifact lookup failed: HTTP ${response.status}`);
            const data = await response.json();
            if (data.artifacts?.some(artifact => artifact.id === expected && artifact.name === process.env.PAGES_ARTIFACT_NAME && !artifact.expired)) {
              console.log('Uploaded Pages artifact is available for deployment');
              process.exit(0);
            }
            console.log(`Waiting for Pages artifact metadata (${attempt}/12)`);
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Uploaded Pages artifact is not available yet; deployment was not started');
          NODE
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
